version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: railopt_db
    environment:
      POSTGRES_DB: railopt
      POSTGRES_USER: railopt
      POSTGRES_PASSWORD: railopt2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railopt -d railopt"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: railopt_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://railopt:railopt2026@db:5432/railopt
      - JWT_SECRET=${JWT_SECRET:-railopt-sih2026-secret-key-change-in-production}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost
      - DEMO_MODE=true
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: railopt_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:

networks:
  default:
    name: railopt_network
